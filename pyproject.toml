[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-audit-rag"
version = "0.1.0"
description = "Enterprise-grade Financial Compliance & Audit Hybrid RAG with Table-Aware Extraction and RAGAS Evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data & AI Specialist" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.33.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.2.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.24",
    "google-genai>=0.1.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
